name: Build OpenScribe Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Check colab_worker.py syntax
        run: python3 -m py_compile app/src/main/assets/colab_worker.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name:  Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Kotlin Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APKs (arm64-v8a & Universal)
        run: gradle assembleDebug --no-daemon

      - name: Upload OpenScribe APKs
        uses: actions/upload-artifact@v4
        with:
          name: OpenScribe-Android-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
