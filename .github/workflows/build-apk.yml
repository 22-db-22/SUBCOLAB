name: Build SUBCOLAB Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Test & Build SUBCOLAB Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Check colab_worker.py syntax
        run: python3 -m py_compile app/src/main/assets/colab_worker.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Kotlin Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build SUBCOLAB Release APK (arm64-v8a)
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        id: sign_apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          buildToolsVersion: '35.0.0'
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload SUBCOLAB Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SUBCOLAB-Android-APKs
          path: |
            ${{ steps.sign_apk.outputs.signedReleaseFile || 'app/build/outputs/apk/release/*.apk' }}
          retention-days: 30
